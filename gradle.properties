# Gradle / Android 构建参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
# 配置缓存能提速；遇到插件不兼容时注释掉即可
#org.gradle.configuration-cache=true

# 缺少 SDK 组件时允许 AGP 自动下载
android.builder.sdkDownload=true

# 命令行执行 gradlew 时若没有配置 JAVA_HOME，可以解开下面这行使用 Android Studio 自带的 JDK
#org.gradle.java.home=D:\\Program Files (x86)\\Android\\Android Studio\\jbr
