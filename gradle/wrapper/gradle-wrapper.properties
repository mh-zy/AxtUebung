# ============================================================================
# Gradle Wrapper 配置：执行 gradlew 时，会自动下载这里指定的 Gradle 版本
# 版本要与 AGP 兼容：AGP 9.4.1 需要 Gradle 9.x（这里用 9.8.0）
#
# 为什么用国内镜像？
#   官方地址 https://services.gradle.org/distributions/... 会 302 跳转到 GitHub，
#   国内网络经常连不上或极慢。腾讯云镜像内容与官方完全一致（已用 sha256 校验），
#   如需换回官方源，把 distributionUrl 改回：
#       https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
#
# distributionSha256Sum 是官方公布的校验值（services.gradle.org/versions/current），
# 用于校验下载包是否完整、是否被篡改。
# ============================================================================
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.8.0-bin.zip
distributionSha256Sum=bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
# 网络超时时间（毫秒）。国内下载 150MB 的 Gradle 发行包，10 秒太短，这里放宽到 60 秒
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
